name: CI

# The app is macOS-only (go-widgets' Cocoa back-end, cgo): there is nothing to
# cross-build. The two architectures are covered by two native runners.
# macos-13 is deliberately not used: that image is retired and its jobs sit
# queued for 24h before GitHub auto-cancels them.
#
#   build-test  (both archs)  gofmt, vet, build, tests with internal/ui at 100%
#                             coverage, race.
#   mvvm                      the go-widgets MVVM gate (mvvmlint): no direct
#                             widget-state writes.
#   bricolint                 the hand-drawn-UI gate, with its negative control.
#   launch      (arm64)       builds Claimward.app, launches it, and reads the
#                             accessibility tree: the NSStatusItem, the native
#                             text fields and the native pop-up button must be
#                             there. (This app has no password field, so there
#                             is no secure text field to look for.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.runner }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon (macos-14-arm64 is "not supported" on this org's runners)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: amd64
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Tests (internal/ui at 100%)
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          ui=$(go tool cover -func=coverage.out | grep '/internal/ui/' | grep -v '100.0%' || true)
          if [ -n "$ui" ]; then echo "::error::internal/ui below 100%"; echo "$ui"; exit 1; fi
      - run: go test -race -count=1 ./...

  mvvm:
    name: MVVM gate
    uses: go-widgets/mvvmlint/.github/workflows/mvvmlint.yml@main
    with:
      # The reusable workflow still defaults to 1.27.1, below this module's go directive.
      go-version: '1.27.4'

  bricolint:
    name: Hand-drawn-UI gate
    runs-on: macos-15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/go-widgets/bricolint/cmd/bricolint@v0.4.0
      - run: go vet -vettool="$(go env GOPATH)/bin/bricolint" ./...
      - name: Negative control (the guard must bite)
        run: BRICOLINT="$(go env GOPATH)/bin/bricolint" bash hack/bricolint-negative-control.sh

  launch:
    name: launch the bundle (status item, native controls)
    runs-on: macos-15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/go-task/task/v3/cmd/task@v3.45.4
      - run: "$(go env GOPATH)/bin/task bundle"
      - name: Launch and read the accessibility tree
        run: |
          open dist/Claimward.app
          sleep 20
          osascript hack/axcheck.applescript | tee ax.txt
          grep -q '^status items: 1' ax.txt
          grep -q '^AXTextField' ax.txt
          grep -q '^AXPopUpButton' ax.txt
